version: 2.1

functions:
  setup-node: github.com/circleci-functions/setup-node@v0.5.0

jobs:
  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup-node:
          with:
            node-version: ">=20"
      - setup-node/install-packages
      - run:
          name: Run tests
          command: circleci testsuite run "node tests"

workflows:
  build-and-test:
    jobs:
      - test
